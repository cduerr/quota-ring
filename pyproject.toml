[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-ring"
version = "0.1.0"
description = "A Linux desktop indicator for AI coding-plan usage limits"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chris Duerr" }]
keywords = ["codex", "claude-code", "kimi", "appindicator", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/cduerr/quota-ring"
Issues = "https://github.com/cduerr/quota-ring/issues"
Source = "https://github.com/cduerr/quota-ring"

[project.scripts]
quota-ring = "quota_ring.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quota_ring = ["assets/icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
