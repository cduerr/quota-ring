[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-ring"
version = "0.1.0"
description = "A Linux desktop indicator for AI coding-plan usage limits"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
quota-ring = "quota_ring.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quota_ring = ["assets/icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
