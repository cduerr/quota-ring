name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          package_version = project["project"]["version"]
          namespace = {}
          exec(Path("src/quota_ring/__init__.py").read_text(), namespace)
          runtime_version = namespace["__version__"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if len({package_version, runtime_version, tag_version}) != 1:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version}, "
                  f"package={package_version}, runtime={runtime_version}"
              )
          PY
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          git archive \
            --format=tar.gz \
            --prefix="quota-ring-${GITHUB_REF_NAME#v}/" \
            --output="dist/quota-ring-${GITHUB_REF_NAME#v}-source.tar.gz" \
            HEAD
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
